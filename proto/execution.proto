syntax = "proto3";

package ucser.execution;

service ExecutionAdapter {
  // Dispatches a command to the adapter for execution.
  rpc DispatchCommand (CommandRequest) returns (CommandResponse);
  
  // Stream for persistent execution where the adapter streams back stdout/stderr
  rpc StreamCommand (CommandRequest) returns (stream CommandOutput);
}

message CommandRequest {
  string execution_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env_vars = 4;
}

message CommandResponse {
  string execution_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
}

message CommandOutput {
  string execution_id = 1;
  oneof output {
    string stdout_chunk = 2;
    string stderr_chunk = 3;
    int32 exit_code = 4;
  }
}
