name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy Linter
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Cargo Tests
      run: cargo test --all --all-features

  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-style: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install grpcio grpcio-tools pytest

    - name: Lint and typecheck check
      run: |
        # Optional: Add python linting if python files are in path
        python -m grpc_tools.protoc -I./proto --python_out=./adapters/linux --grpc_python_out=./adapters/linux ./proto/execution.proto
